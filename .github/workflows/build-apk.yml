name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q personal_ai_client_v1.0_GitHub_APK_build.zip -d project

      - name: Find project root
        run: |
          PROJECT_ROOT=$(dirname "$(find project -name capacitor.config.json -type f -print -quit)")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install npm dependencies
        run: |
          cd "$PROJECT_ROOT"
          npm install

      - name: Build web app
        run: |
          cd "$PROJECT_ROOT"
          npm run build

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_ROOT"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT/android"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-client-debug-apk
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
